<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>МедЕксперт CRM — ПМР Любецька</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{ink:'#172033',muted:'#68758a',line:'#e7ebf2',brand:'#176b68',brandlight:'#e8f5f3',orange:'#e97943',cream:'#f7f9fc'}}}};</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f7f9fc}body{margin:0}.scrollbar::-webkit-scrollbar{width:6px;height:6px}.scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:12px;color:#748096;font-size:14px;transition:.2s}.nav-item:hover,.nav-item.active{background:#e8f5f3;color:#176b68;font-weight:650}.card{background:#fff;border:1px solid #e7ebf2;border-radius:16px;box-shadow:0 2px 8px #17203308}.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:650;transition:.2s}.btn-primary{background:#176b68;color:white}.btn-primary:hover{background:#0f5755}.btn-soft{background:#e8f5f3;color:#176b68}.btn-ghost{background:#fff;border:1px solid #e7ebf2;color:#536176}.input,.select{width:100%;border:1px solid #dbe1ea;border-radius:9px;padding:10px 12px;font-size:13px;outline:none;background:#fff}.input:focus,.select:focus{border-color:#176b68;box-shadow:0 0 0 3px #176b6818}.badge{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700}.table th{color:#8994a6;font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:12px 14px;background:#fbfcfe}.table td{padding:13px 14px;border-top:1px solid #eef1f5;font-size:13px;vertical-align:middle}.modal{position:fixed;inset:0;background:#17203380;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.hidden{display:none}.bar{height:9px;border-radius:99px;background:#e9eef3;overflow:hidden}.bar>span{display:block;height:100%;border-radius:99px;background:#176b68}.tab{display:none}.tab.active{display:block}.toast{position:fixed;right:24px;bottom:24px;background:#172033;color:#fff;padding:13px 16px;border-radius:10px;z-index:70;font-size:13px}
  </style>
</head>
<body>
  <div id="app" class="min-h-screen flex">
    <aside class="w-[250px] bg-white border-r border-line p-5 hidden lg:flex flex-col shrink-0">
      <div class="flex items-center gap-3 mb-8"><div class="w-10 h-10 rounded-xl bg-brand text-white grid place-items-center font-bold">МЕ</div><div><div class="font-bold text-ink">МедЕксперт</div><div class="text-[11px] text-muted">CRM поліклініки</div></div></div>
      <div class="text-[10px] uppercase tracking-widest text-slate-400 font-bold px-3 mb-2">Робочий стіл</div>
      <nav id="nav" class="space-y-1"></nav>
      <div class="mt-auto pt-5 border-t border-line"><div class="flex gap-3 items-center"><div class="w-9 h-9 rounded-full bg-orange/10 text-orange grid place-items-center font-bold text-xs">ОМ</div><div><div class="text-sm font-semibold">Олена Мельник</div><div class="text-xs text-muted">Адміністратор</div></div></div></div>
    </aside>
    <main class="flex-1 min-w-0"><header class="h-[72px] bg-white border-b border-line px-5 md:px-8 flex items-center justify-between"><div><div class="text-xs text-muted">Понеділок, 14 вересня 2026</div><h1 id="pageTitle" class="text-xl font-bold mt-1">Журнал місяця</h1></div><div class="flex gap-3 items-center"><div class="hidden md:flex items-center gap-2 bg-cream px-3 py-2 rounded-lg text-sm text-muted"><i data-lucide="search" class="w-4"></i><input id="globalSearch" class="bg-transparent outline-none w-44" placeholder="Пошук пацієнта..." /></div><button class="btn btn-ghost" onclick="showToast('Синхронізація локальних даних виконана')"><i data-lucide="refresh-cw" class="w-4"></i></button><button class="w-9 h-9 rounded-full bg-brandlight text-brand font-bold text-xs">ОМ</button></div></header><div class="p-5 md:p-8 max-w-[1500px] mx-auto"><div id="content"></div></div></main>
  </div>
  <div id="modal" class="modal hidden"><div id="modalBox" class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-auto scrollbar"></div></div><div id="toast" class="toast hidden"></div>
  <script type="module">
    const seed={records:[{date:'14.09.2026',name:'Ковальчук Марія Олександрівна',year:'1986',phone:'+380 67 245 18 32',decl:'Декларант',doctor:'Кравченко О.М.',service:'Консультація сімейного лікаря',pay:'Готівка',sum:450},{date:'14.09.2026',name:'Бондаренко Іван Петрович',year:'1972',phone:'+380 93 812 04 18',decl:'Декларант',doctor:'Кравченко О.М.',service:'ЕКГ',pay:'Термінал',sum:250},{date:'13.09.2026',name:'Шевченко Анастасія Ігорівна',year:'1998',phone:'+380 50 111 22 33',decl:'Не декларант',doctor:'Петренко Н.В.',service:'ЗАК',pay:'Безоплатно',sum:0}],vaccines:[{name:'Коронавак',maker:'Sinovac Biotech',batch:'CVX-24031',expiry:'11.2026',start:24,received:100,used:112,waste:2},{name:'Діфтерія-правець',maker:'Індійський інститут',batch:'DT-6108',expiry:'02.2027',start:8,received:0,used:1,waste:0},{name:'КПК Priorix',maker:'GSK',batch:'PKP-8842',expiry:'07.2027',start:18,received:40,used:21,waste:1}],labs:[{date:'14.09.2026',patient:'Ковальчук М.О.',type:'ЗАК',doctor:'Кравченко О.М.',status:'Готово',result:'Гемоглобін 128 г/л; лейкоцити 6.2',conclusion:'Без патологічних змін'},{date:'14.09.2026',patient:'Романюк В.В.',type:'Глюкоза крові',doctor:'Петренко Н.В.',status:'В роботі',result:'—',conclusion:'—'}],branches:[{name:'ПМР вул. Любецька',address:'м. Чернігів, вул. Любецька, 40',edrpou:'41234567',phones:['+380 462 67 12 44','+380 93 123 45 67'],main:true},{name:'Амбулаторія №2',address:'м. Чернігів, вул. Шевченка, 18',edrpou:'41234568',phones:['+380 462 65 10 20'],main:false}],users:[{name:'Олена Мельник',role:'Адміністратор',access:['Журнал місяця','Вакцини','Лабораторія','Аналітика','Заклади та філії','Користувачі']},{name:'Олександр Кравченко',role:'Лікар',access:['Журнал місяця','Лабораторія']},{name:'Наталія Петренко',role:'Медсестра',access:['Вакцини','Лабораторія']}]};
    const data=JSON.parse(localStorage.getItem('medexpert-crm')||'null')||seed; const save=()=>localStorage.setItem('medexpert-crm',JSON.stringify(data)); let active='journal';
    const navItems=[['journal','Журнал місяця','calendar-days'],['vaccines','Вакцини','syringe'],['labs','Лабораторія та діагностика','flask-conical'],['branches','Заклади та філії','building-2'],['users','Користувачі та доступи','users'],['analytics','Аналітика та статистика','chart-no-axes-combined']];
    function init(){document.getElementById('nav').innerHTML=navItems.map(([id,t,icon])=>`<button class="nav-item ${id===active?'active':''}" data-tab="${id}"><i data-lucide="${icon}" class="w-4"></i>${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{active=x.dataset.tab;render()});lucide.createIcons()}
    const money=n=>new Intl.NumberFormat('uk-UA').format(n)+' ₴'; const pill=(t,c='bg-brandlight text-brand')=>`<span class="badge ${c}">${t}</span>`; const empty=(t='Немає даних')=>`<div class="py-12 text-center text-muted text-sm">${t}</div>`;
    function render(){init();document.getElementById('pageTitle').textContent=navItems.find(x=>x[0]===active)[1];document.getElementById('content').innerHTML=views[active]();lucide.createIcons()}
    function toolbar(title,button,onclick){return `<div class="flex flex-wrap justify-between items-center gap-3 mb-6"><div><h2 class="text-2xl font-bold">${title}</h2><p class="text-sm text-muted mt-1">ПМР вул. Любецька · автономний облік</p></div>${button?`<button class="btn btn-primary" onclick="${onclick}"><i data-lucide="plus" class="w-4"></i>${button}</button>`:''}</div>`}
    function journal(){const total=data.records.reduce((a,r)=>a+Number(r.sum),0), cash=data.records.filter(r=>r.pay==='Готівка').reduce((a,r)=>a+Number(r.sum),0), term=data.records.filter(r=>r.pay==='Термінал').reduce((a,r)=>a+Number(r.sum),0);return toolbar('Журнал місяця','Додати запис','openRecord()')+`<div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">${[['Загальна каса',money(total),'wallet','#176b68'],['Готівка',money(cash),'banknote','#e97943'],['Термінал',money(term),'credit-card','#4f65b5'],['Кількість прийомів',data.records.length,'calendar-check','#8a56b8']].map(x=>`<div class="card p-5"><div class="flex justify-between text-sm text-muted">${x[0]}<i data-lucide="${x[2]}" class="w-4" style="color:${x[3]}"></i></div><div class="text-2xl font-bold mt-3">${x[1]}</div><div class="text-xs text-emerald-600 mt-2">↑ 12% до минулого місяця</div></div>`).join('')}</div><div class="card overflow-hidden"><div class="p-4 flex flex-wrap gap-3 justify-between"><div class="flex gap-2"><select id="recordFilter" class="select !w-auto"><option>Усі лікарі</option><option>Кравченко О.М.</option><option>Петренко Н.В.</option></select><select class="select !w-auto"><option>Вересень 2026</option></select></div><button class="btn btn-ghost" onclick="exportCSV()"><i data-lucide="download" class="w-4"></i>Експорт CSV</button></div><div class="overflow-x-auto"><table class="table w-full"><thead><tr><th>Дата</th><th>Пацієнт</th><th>Рік / телефон</th><th>Декларація</th><th>Лікар</th><th>Послуга</th><th>Оплата</th><th>Сума</th></tr></thead><tbody>${data.records.map(r=>`<tr><td class="whitespace-nowrap">${r.date}</td><td class="font-semibold">${r.name}</td><td>${r.year}<br><span class="text-xs text-muted">${r.phone}</span></td><td>${pill(r.decl,r.decl==='Декларант'?'bg-blue-50 text-blue-700':'bg-slate-100 text-slate-600')}</td><td>${r.doctor}</td><td>${r.service}</td><td>${pill(r.pay,r.pay==='Безоплатно'?'bg-slate-100 text-slate-600':r.pay==='Готівка'?'bg-orange-50 text-orange':'bg-violet-50 text-violet-700')}</td><td class="font-bold">${money(r.sum)}</td></tr>`).join('')}</tbody></table></div></div>`}
    function vaccines(){return toolbar('Вакцини','Додати препарат','openVaccine()')+`<div class="card overflow-hidden"><div class="p-4 border-b border-line flex justify-between"><div><b>Склад холодового ланцюга</b><p class="text-xs text-muted mt-1">Баланс доз у розрізі серій та термінів придатності</p></div><button class="btn btn-soft" onclick="showToast('Звіт про склад сформовано')"><i data-lucide="file-text" class="w-4"></i>Звіт</button></div><div class="overflow-x-auto"><table class="table w-full"><thead><tr><th>Препарат</th><th>Виробник / серія</th><th>Термін</th><th>Початок</th><th>Отримано</th><th>Використано</th><th>Списано</th><th>Залишок</th><th>Дія</th></tr></thead><tbody>${data.vaccines.map((v,i)=>{let left=v.start+v.received-v.used-v.waste;return `<tr><td class="font-semibold">${v.name}</td><td>${v.maker}<br><span class="text-xs text-muted">${v.batch}</span></td><td>${v.expiry}</td><td>${v.start}</td><td>${v.received}</td><td>${v.used}</td><td>${v.waste}</td><td>${left<10?pill(left+' дози','bg-red-50 text-red-700'):pill(left+' доз')}</td><td><button class="btn btn-ghost !p-2" title="Швидке списання" onclick="writeOff(${i})"><i data-lucide="minus-circle" class="w-4"></i></button></td></tr>`}).join('')}</tbody></table></div></div><div class="mt-4 text-xs text-muted">Формула залишку: залишок на початок + отримано − використано − списано.</div>`}
    function labs(){return toolbar('Лабораторія та діагностика','Нове направлення','openLab()')+`<div class="grid md:grid-cols-3 gap-4 mb-6"><div class="card p-5"><div class="text-sm text-muted">Направлень за місяць</div><div class="text-2xl font-bold mt-2">${data.labs.length}</div></div><div class="card p-5"><div class="text-sm text-muted">В роботі</div><div class="text-2xl font-bold mt-2 text-orange-500">${data.labs.filter(x=>x.status==='В роботі').length}</div></div><div class="card p-5"><div class="text-sm text-muted">Готово</div><div class="text-2xl font-bold mt-2 text-emerald-600">${data.labs.filter(x=>x.status==='Готово').length}</div></div></div><div class="card overflow-hidden"><div class="overflow-x-auto"><table class="table w-full"><thead><tr><th>Дата</th><th>Пацієнт</th><th>Дослідження</th><th>Лікар</th><th>Статус</th><th>Показники</th><th>Клінічний висновок</th></tr></thead><tbody>${data.labs.map(x=>`<tr><td>${x.date}</td><td class="font-semibold">${x.patient}</td><td>${x.type}</td><td>${x.doctor}</td><td>${pill(x.status,x.status==='Готово'?'bg-emerald-50 text-emerald-700':'bg-orange-50 text-orange')}</td><td>${x.result}</td><td>${x.conclusion}</td></tr>`).join('')}</tbody></table></div></div>`}
    function branches(){return toolbar('Заклади та філії','Додати підрозділ','openBranch()')+`<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-5">${data.branches.map((b,i)=>`<div class="card p-5 relative">${b.main?'<div class="absolute top-5 right-5">'+pill('Головна','bg-brandlight text-brand')+'</div>':''}<div class="w-11 h-11 rounded-xl bg-brandlight text-brand grid place-items-center mb-4"><i data-lucide="building-2" class="w-5"></i></div><h3 class="font-bold text-lg">${b.name}</h3><p class="text-sm text-muted mt-2">${b.address}</p><div class="mt-4 pt-4 border-t border-line text-sm"><div class="text-xs text-muted mb-2">ЄДРПОУ ${b.edrpou} · Реєстратура</div>${b.phones.map(p=>`<div class="flex items-center gap-2 mb-1"><i data-lucide="phone" class="w-3 text-brand"></i>${p}</div>`).join('')}</div><button class="btn btn-ghost mt-4 w-full justify-center" onclick="openBranch(${i})"><i data-lucide="pencil" class="w-4"></i>Редагувати реквізити</button></div>`).join('')}</div>`}
    function users(){const perms=['Журнал місяця','Вакцини','Лабораторія','Аналітика','Заклади та філії','Користувачі'];return toolbar('Користувачі та доступи','Додати користувача','openUser()')+`<div class="card overflow-hidden"><div class="overflow-x-auto"><table class="table w-full"><thead><tr><th>Користувач</th><th>Роль</th><th>Доступ до модулів</th><th>Дія</th></tr></thead><tbody>${data.users.map((u,i)=>`<tr><td class="font-semibold">${u.name}</td><td>${pill(u.role,'bg-violet-50 text-violet-700')}</td><td><div class="flex flex-wrap gap-1">${u.access.map(a=>pill(a,'bg-slate-100 text-slate-600')).join('')}</div></td><td><button class="btn btn-ghost !p-2" onclick="openUser(${i})"><i data-lucide="settings-2" class="w-4"></i></button></td></tr>`).join('')}</tbody></table></div></div>`}
    function analytics(){let doctors=[...new Set(data.records.map(r=>r.doctor))];return toolbar('Аналітика та статистика')+`<div class="grid lg:grid-cols-2 gap-5"><div class="card p-6"><h3 class="font-bold">Навантаження лікарів</h3><p class="text-xs text-muted mt-1">Кількість прийомів у вересні</p>${doctors.map(d=>{let n=data.records.filter(r=>r.doctor===d).length;return `<div class="mt-5"><div class="flex justify-between text-sm mb-2"><span>${d}</span><b>${n} прийоми</b></div><div class="bar"><span style="width:${n/data.records.length*100}%"></span></div></div>`}).join('')}</div><div class="card p-6"><h3 class="font-bold">Структура оплати</h3><p class="text-xs text-muted mt-1">Розподіл надходжень каси</p>${['Готівка','Термінал','Безоплатно'].map((p,i)=>{let n=data.records.filter(r=>r.pay===p).length;let colors=['#e97943','#4f65b5','#9aa6b6'];return `<div class="mt-5"><div class="flex justify-between text-sm mb-2"><span class="flex items-center gap-2"><i class="w-2 h-2 rounded-full" style="background:${colors[i]}"></i>${p}</span><b>${Math.round(n/data.records.length*100)}%</b></div><div class="bar"><span style="width:${n/data.records.length*100}%;background:${colors[i]}"></span></div></div>`}).join('')}</div><div class="card p-6 lg:col-span-2"><h3 class="font-bold">Обсяг послуг</h3><div class="grid sm:grid-cols-3 gap-4 mt-5">${['Консультації','Лабораторна діагностика','Інструментальна діагностика'].map((x,i)=>`<div class="bg-cream rounded-xl p-4"><div class="text-xs text-muted">${x}</div><div class="text-2xl font-bold mt-2">${[12,8,5][i]}</div><div class="text-xs text-emerald-600 mt-1">+${[8,14,4][i]}% до серпня</div></div>`).join('')}</div></div></div>`}
    const views={journal,vaccines,labs,branches,users,analytics};
    function modal(title,body,saveText='Зберегти'){document.getElementById('modalBox').innerHTML=`<div class="p-6 border-b border-line flex justify-between"><h3 class="text-lg font-bold">${title}</h3><button onclick="closeModal()"><i data-lucide="x" class="w-5"></i></button></div><div class="p-6">${body}</div><div class="p-5 border-t border-line flex justify-end gap-2"><button class="btn btn-ghost" onclick="closeModal()">Скасувати</button><button class="btn btn-primary" id="modalSave">${saveText}</button></div>`;document.getElementById('modal').classList.remove('hidden');lucide.createIcons()}; const closeModal=()=>document.getElementById('modal').classList.add('hidden'); const field=(label,id,value='',type='text')=>`<label class="block text-sm font-semibold">${label}<input id="${id}" class="input mt-2" value="${value}" type="${type}" /></label>`;
    function openRecord(){modal('Новий запис журналу',`<div class="grid md:grid-cols-2 gap-4">${field('Дата','rdate','14.09.2026')}${field('ПІБ пацієнта','rname')}${field('Рік народження','ryear','','number')}${field('Телефон','rphone')}${field('Лікар','rdoctor','Кравченко О.М.')}${field('Послуга / маніпуляція','rservice')}<label class="text-sm font-semibold">Статус декларації<select id="rdecl" class="select mt-2"><option>Декларант</option><option>Не декларант</option></select></label><label class="text-sm font-semibold">Форма оплати<select id="rpay" class="select mt-2"><option>Готівка</option><option>Термінал</option><option>Безоплатно</option></select></label>${field('Сума, грн','rsum','0','number')}</div>`);document.getElementById('modalSave').onclick=()=>{data.records.unshift({date:rdate.value,name:rname.value,year:ryear.value,phone:rphone.value,decl:rdecl.value,doctor:rdoctor.value,service:rservice.value,pay:rpay.value,sum:Number(rsum.value)});save();closeModal();render();showToast('Запис додано до журналу')}}
    function openVaccine(){modal('Новий імунобіологічний препарат',`<div class="grid md:grid-cols-2 gap-4">${field('Назва препарату','vname')}${field('Виробник','vmaker')}${field('Серія / партія','vbatch')}${field('Термін придатності','vexp')}${field('Залишок на початок','vstart','0','number')}${field('Отримано','vrec','0','number')}</div>`);document.getElementById('modalSave').onclick=()=>{data.vaccines.push({name:vname.value,maker:vmaker.value,batch:vbatch.value,expiry:vexp.value,start:Number(vstart.value),received:Number(vrec.value),used:0,waste:0});save();closeModal();render();showToast('Препарат додано')}}
    function writeOff(i){let n=prompt('Кількість доз для списання:','1');if(n&&Number(n)>0){data.vaccines[i].waste+=Number(n);save();render();showToast('Дози списано')}}
    function openLab(){modal('Нове лабораторне направлення',`<div class="grid md:grid-cols-2 gap-4">${field('Дата','ldate','14.09.2026')}${field('Пацієнт','lpatient')}${field('Дослідження','ltype','ЗАК')} ${field('Лікар','ldoc','Кравченко О.М.')}</div>`);document.getElementById('modalSave').onclick=()=>{data.labs.unshift({date:ldate.value,patient:lpatient.value,type:ltype.value,doctor:ldoc.value,status:'В роботі',result:'—',conclusion:'—'});save();closeModal();render();showToast('Направлення створено')}}
    function openBranch(i){let b=i!=null?data.branches[i]:{name:'',address:'',edrpou:'',phones:[''],main:false};modal(i!=null?'Редагувати підрозділ':'Новий підрозділ',`<div class="space-y-4">${field('Назва підрозділу','bname',b.name)}${field('Адреса','baddress',b.address)}${field('ЄДРПОУ','bedrpou',b.edrpou)}<div><div class="text-sm font-semibold mb-2">Телефони реєстратури</div><div id="phones" class="space-y-2">${b.phones.map((p,j)=>`<div class="flex gap-2"><input class="input phone" value="${p}" placeholder="+380 ..." /><button class="btn btn-ghost !p-2" onclick="this.parentElement.remove()"><i data-lucide="trash-2" class="w-4"></i></button></div>`).join('')}</div><button class="btn btn-soft mt-2" onclick="addPhone()"><i data-lucide="plus" class="w-4"></i>Додати номер</button></div></div>`);document.getElementById('modalSave').onclick=()=>{let entry={name:bname.value,address:baddress.value,edrpou:bedrpou.value,phones:[...document.querySelectorAll('.phone')].map(x=>x.value).filter(Boolean),main:b.main};if(i==null)data.branches.push(entry);else data.branches[i]=entry;save();closeModal();render();showToast('Реквізити збережено')}}
    function addPhone(){let d=document.createElement('div');d.className='flex gap-2';d.innerHTML='<input class="input phone" placeholder="+380 ..." /><button class="btn btn-ghost !p-2" onclick="this.parentElement.remove()"><i data-lucide="trash-2" class="w-4"></i></button>';document.getElementById('phones').append(d);lucide.createIcons()}
    function openUser(i){let u=i!=null?data.users[i]:{name:'',role:'Лікар',access:[]},perms=['Журнал місяця','Вакцини','Лабораторія','Аналітика','Заклади та філії','Користувачі'];modal(i!=null?'Налаштування доступу':'Новий користувач',`<div class="space-y-4">${field('ПІБ користувача','uname',u.name)}<label class="text-sm font-semibold">Роль<select id="urole" class="select mt-2">${['Адміністратор','Лікар','Медсестра','Касир'].map(x=>`<option ${x===u.role?'selected':''}>${x}</option>`).join('')}</select></label><div><div class="text-sm font-semibold mb-2">Доступ до вкладок</div><div class="grid sm:grid-cols-2 gap-2">${perms.map(x=>`<label class="flex gap-2 items-center text-sm border border-line rounded-lg p-3"><input type="checkbox" value="${x}" ${u.access.includes(x)?'checked':''} class="access">${x}</label>`).join('')}</div></div></div>`);document.getElementById('modalSave').onclick=()=>{let entry={name:uname.value,role:urole.value,access:[...document.querySelectorAll('.access:checked')].map(x=>x.value)};if(i==null)data.users.push(entry);else data.users[i]=entry;save();closeModal();render();showToast('Доступи збережено')}}
    function exportCSV(){let h=['Дата','ПІБ пацієнта','Рік народження','Телефон','Статус декларації','Лікар','Послуга','Форма оплати','Сума'];let csv=[h,...data.records.map(r=>[r.date,r.name,r.year,r.phone,r.decl,r.doctor,r.service,r.pay,r.sum])].map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='zhurnal-veresen-2026.csv';a.click();showToast('CSV-файл експортовано')}
    function showToast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2600)};window.openRecord=openRecord;window.openVaccine=openVaccine;window.openLab=openLab;window.openBranch=openBranch;window.openUser=openUser;window.writeOff=writeOff;window.addPhone=addPhone;window.closeModal=closeModal;window.exportCSV=exportCSV;window.showToast=showToast;render();
  </script>
</body>
</html>
